apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-okn.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-okn.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcp-okn.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-okn.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mcp-okn.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: mcp-okn
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "mcp-okn.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          # ── Command ─────────────────────────────────────────────────────────
          # The image CMD starts streamable-http; host/port come from the env
          # below. No command/args override needed.

          # ── Environment variables ────────────────────────────────────────────
          env:
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: {{ .Values.port | quote }}
            - name: UVICORN_FORWARDED_ALLOW_IPS
              value: '*'
            - name: UVICORN_PROXY_HEADERS
              value: 'true'
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          # ── Ports ────────────────────────────────────────────────────────────
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP



          # ── Probes ───────────────────────────────────────────────────────────
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          # ── Resources ────────────────────────────────────────────────────────
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # ── Volume mounts ─────────────────────────────────────────────────────
          volumeMounts:
            # tmpdir needed when readOnlyRootFilesystem=true (Python needs /tmp)
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
