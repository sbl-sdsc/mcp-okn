name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-suffix: lint

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-suffix: test-${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run tests (offline)
        run: uv run python -m pytest -q

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-suffix: skills

      - name: Validate skills against the Agent Skills spec
        run: |
          for skill in skills/okn-report-style skills/okn-bioanalysis; do
            echo "::group::agentskills validate $skill"
            uvx --from skills-ref agentskills validate "$skill"
            echo "::endgroup::"
          done

      - name: Check each skill package is in sync with its folder
        run: |
          rc=0
          for skill in okn-report-style okn-bioanalysis; do
            for ext in skill zip; do
              echo "::group::package sync: $skill.$ext"
              tmp="$(mktemp -d)"
              # Each package bundles the folder verbatim (minus __pycache__/.DS_Store,
              # which are gitignored and excluded), so a recursive diff must be clean.
              # A mismatch means SKILL.md/references/scripts were edited but the
              # packages were not rebuilt with scripts/package_skills.sh.
              if [ ! -f "skills/$skill.$ext" ]; then
                echo "::error::skills/$skill.$ext is missing — run scripts/package_skills.sh"
                rc=1
              else
                unzip -q "skills/$skill.$ext" -d "$tmp"
                if ! diff -r -x __pycache__ -x '.DS_Store' "skills/$skill" "$tmp/$skill"; then
                  echo "::error::skills/$skill.$ext is out of sync with skills/$skill — run scripts/package_skills.sh"
                  rc=1
                fi
              fi
              echo "::endgroup::"
            done
          done
          exit $rc
