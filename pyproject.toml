[project]
name = "mcp-okn"
version = "0.1.0"
description = "MCP server for querying the FRINK federated SPARQL endpoint over Proto-OKN knowledge graphs"
readme = "README.md"
authors = [
    { name = "Peter W. Rose", email = "pwrose.ucsd@gmail.com" },
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/sbl-sdsc/mcp-okn"

[project.scripts]
mcp-okn = "mcp_okn.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_okn"]

[tool.hatch.build.targets.wheel.force-include]
"src/mcp_okn/data/kgs.json" = "mcp_okn/data/kgs.json"
"src/mcp_okn/data/crosswalks.json" = "mcp_okn/data/crosswalks.json"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Layer-2 (Claude agent) of the registry benchmark. The dataset build and
# layer-1 smoke need nothing beyond the core deps; only the agent needs this.
# Install with `uv sync --group benchmark` (and set ANTHROPIC_API_KEY).
benchmark = [
    "anthropic>=0.39",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors (E) + warnings (W), isort (I),
# pyupgrade (UP), flake8-bugbear (B), flake8-comprehensions (C4).
select = ["F", "E", "W", "I", "UP", "B", "C4"]
# Line length is owned by the formatter; the remaining long lines are SPARQL
# strings, URLs, and docstrings that shouldn't be force-wrapped.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/mcp_okn"]
ignore_missing_imports = true
# Tightening incrementally toward strict (see BACKLOG.md).
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
